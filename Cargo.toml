[package]
name = "rsfitsio"
version = "0.464.0"
edition = "2024"
rust-version = "1.96"
description = "Rust bindings for the CFITSIO library, providing access to FITS files."
license = "MIT OR Apache-2.0"
repository = "https://github.com/petesmc/rsfitsio"
categories = ["science", "aerospace", "external-ffi-bindings"]
keywords = [
    "fits",
    "fitsio",
    "cfitsio",
    "astronomy",
    "ffi",
]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "smem"
required-features = ["shared_mem"]

[[example]]
name = "cookbook_c"
test = true

[[example]]
name = "cookbook_rust"
test = true

[[example]]
name = "cookbook_expanded_rust"
test = true

[features]
default = ["bzip2"]
bzip2 = ["dep:libbz2-rs-sys"]
shared_mem= []
net_services = []

[dependencies]
libz-rs-sys = { version = "0.6.6" }
libbz2-rs-sys = { version = "0.2.5", optional = true}
libc="0.2.186"
bytemuck = "1.25.1"
fastrand = "2.4"
pwd = "1.4"
ricecomp = "0.5"
pliocomp = "0.6"
hcompress = "0.4"
chrono = ">=0.4.20"
cbitset = "0.2"
memchr = { version = "2.8.3", default-features = false }
errno = "0.3.14"
# Used by the fpack/funpack binaries: temporary output files (fpack's fp_tmpnam)
# and `funpack -Z` gzipping.  Binaries cannot see [dev-dependencies], so these
# live here.  flate2 is pinned to the zlib-rs backend so it shares the
# libz-rs-sys already in the tree rather than pulling in a second zlib.
tempfile = "3.27"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
