name: CI

on:
  pull_request:
    branches:
      - main
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-on-linux-x64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Temporarily modify the rust toolchain version
      run: rustup override set 1.96.0
    - name: Output rust version for educational purposes
      run: rustup --version

    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run shared_mem driver tests
      run: |
        ipcs -m || true
        cargo test --features shared_mem --lib drvrsmem
        cargo test --features shared_mem --test test_drvrsmem_xproc
      env:
        SHMEM_LIB_KEYBASE: 24000000
    - name: Clean up leaked SysV shared segments
      if: always()
      run: |
        ipcs -m || true
        for id in $(ipcs -m | awk 'NR>3 {print $2}'); do ipcrm -m "$id" 2>/dev/null || true; done
    - name: Run testprog checks
      run: bash ./testprog_check.sh

  build-linux-arm64:

    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v7
    - name: Temporarily modify the rust toolchain version
      run: rustup override set 1.96.0
    - name: Output rust version for educational purposes
