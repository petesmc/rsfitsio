on:
  push:
    branches: [main]
  pull_request:
name: Coverage

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable
      - name: Output rust version for educational purposes
        run: rustup --version
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: |
          cargo llvm-cov clean --workspace # remove artifacts that may affect the coverage results
          cargo llvm-cov --no-report
          cargo llvm-cov run --example testprog --no-report
          cargo llvm-cov run --example cookbook_c --no-report
          cargo llvm-cov run --example cookbook_rust --no-report
          cargo llvm-cov run --example cookbook_expanded_rust --no-report
          cargo llvm-cov run --example iter_a --no-report
          cargo llvm-cov run --example iter_b --no-report
          cargo llvm-cov run --example iter_c --no-report
          # fitsverify exits with the number of errors + warnings it found, so
          # a non-zero status here is a normal result, not a failure.
          cargo llvm-cov run --bin fitsverify --no-report -- testprog.fit || true
          cargo llvm-cov run --bin fitsverify --no-report -- -l testprog.fit || true
          cargo llvm-cov run --bin fitsverify --no-report -- -q -e testprog.fit || true
          cargo llvm-cov run --bin fitsverify --no-report -- -H testprog.fit || true
          cargo llvm-cov run --bin fitsverify --no-report -- examples/iter_a/iter_a.fit examples/iter_b/iter_b.fit examples/iter_c/iter_c.fit || true
          cargo llvm-cov run --bin fitsverify --no-report -- -l examples/iter_var/vari.fits || true
          # fpack/funpack: pack with each algorithm, list, report, and unpack
          # again.  `-C' drops the timestamped checksum cards and `-q0 4' fixes
          # the dither seed, so each run is reproducible.
          cp testprog.fit fp_work.fit
          cargo llvm-cov run --bin fpack --no-report -- -C -q0 4 -v fp_work.fit
          cargo llvm-cov run --bin fpack --no-report -- -L fp_work.fit.fz
          rm -f fp_work.fit
          cargo llvm-cov run --bin funpack --no-report -- -C -v fp_work.fit.fz
          rm -f fp_work.fit fp_work.fit.fz
          for alg in -r -g -g2 -d; do
            cp testprog.fit fp_work.fit
            cargo llvm-cov run --bin fpack --no-report -- -C -q0 4 $alg fp_work.fit
            rm -f fp_work.fit
            cargo llvm-cov run --bin funpack --no-report -- -C fp_work.fit.fz
            rm -f fp_work.fit fp_work.fit.fz
          done
          cargo llvm-cov run --bin fpack --no-report -- -T testprog.fit
          cargo llvm-cov run --bin fpack --no-report -- -H
          cargo llvm-cov run --bin funpack --no-report -- -H
          # both exit non-zero on purpose here
          cargo llvm-cov run --bin fpack --no-report -- || true
          cargo llvm-cov run --bin funpack --no-report -- nosuchfile.fits || true
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cruzzil/rsfitsio